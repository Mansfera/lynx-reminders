# XcodeGen spec: `xcodegen generate` (in apple/) writes LynxReminders.xcodeproj.
name: LynxReminders
options:
  bundleIdPrefix: com.mansfera
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  LynxKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2 "approachable concurrency": app code is main-actor by default.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "3"
    PRODUCT_BUNDLE_IDENTIFIER: com.mansfera.lynxreminders
    PRODUCT_NAME: Lynx Reminders
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
    INFOPLIST_KEY_CFBundleDisplayName: Lynx Reminders
targetTemplates:
  LynxApp:
    type: application
    sources:
      - path: App/Shared
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icon
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Config/Supabase.json
        buildPhase: resources
    dependencies:
      - package: LynxKit
        product: LynxCore
      - package: LynxKit
        product: LynxSync
targets:
  LynxReminders-macOS:
    templates: [LynxApp]
    platform: macOS
    sources:
      - path: App/macOS
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Lynx Reminders
        CFBundleName: Lynx Reminders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: mansfera
        NSLocationUsageDescription: Lynx alerts location reminders when you arrive at or leave a place.
        NSLocationWhenInUseUsageDescription: Lynx uses your location to pick places and alert location reminders.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lynx alerts location reminders when you arrive at or leave a place, even when its window is closed.
        NSLocationAlwaysUsageDescription: Lynx alerts location reminders when you arrive at or leave a place, even when its window is closed.
        NSBluetoothAlwaysUsageDescription: Lynx alerts reminders when a Bluetooth device such as your headphones connects or disconnects.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.mansfera.lynxreminders
            CFBundleURLSchemes: [lynxreminders]
    entitlements:
      path: App/macOS/LynxReminders.entitlements
      properties:
        com.apple.security.personal-information.location: true
        com.apple.security.device.bluetooth: true
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  LynxReminders-iOS:
    templates: [LynxApp]
    platform: iOS
    sources:
      - path: App/iOS
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Lynx Reminders
        CFBundleName: Lynx Reminders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: Lynx uses your location to pick places and alert location reminders.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lynx alerts location reminders when you arrive at or leave a place, even when the app is closed.
        NSBluetoothAlwaysUsageDescription: Lynx alerts reminders when a Bluetooth device connects or disconnects.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.mansfera.lynxreminders
            CFBundleURLSchemes: [lynxreminders]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  LynxReminders-macOS:
    build:
      targets:
        LynxReminders-macOS: all
    run:
      config: Debug
  LynxReminders-iOS:
    build:
      targets:
        LynxReminders-iOS: all
    run:
      config: Debug
