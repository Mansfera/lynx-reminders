<!doctype html>
<html><body style="margin:0;padding:32px 16px;background:#ffffff;color:#0E0E10;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <div style="max-width:420px;margin:0 auto">
    <p style="margin:0 0 4px;font-size:13px;color:#6A6F7C">Lynx Reminders</p>
    <h1 style="margin:0 0 20px;font-size:22px;font-weight:600">Your sign-in code</h1>

      <span style="font-family:ui-monospace,Menlo,monospace;font-size:34px;letter-spacing:8px;font-weight:600">{{ .Token }}</span>
    </div>
    <p style="margin:20px 0 0;font-size:14px;line-height:1.5">Type this code in Lynx Reminders to sign in. It works for one hour.</p>
    <p style="margin:12px 0 0;font-size:13px;color:#6A6F7C">Didn't ask for this? Ignore this email.</p>
  </div>
</body></html>
